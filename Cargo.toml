[package]
name = "multisink"
description = "A simple Wayland/X11-compatible tool that mirrors audio to multiple outputs at once, using PipeWire or PulseAudio. Includes both a CLI and GTK4 GUI."
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "^4.5", features = ["derive"] }
anyhow = "^1.0"
thiserror = "^2.0"
gtk4 = { version = "^0.10", package = "gtk4" }