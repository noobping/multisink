version: 1

AppDir:
  path: ./Multisink.AppDir
  app_info:
    id: dev.noobping.multisink
    name: Multisink
    version: "1.0.0"
    exec: usr/bin/multisink
    exec_args: gui

  runtime:
    env:
      GDK_BACKEND: wayland

  apt:
    arch: amd64
    sources:
      - deb http://deb.debian.org/debian/ bookworm main
    include:
      - libgtk-4-1
      - libadwaita-1-0
      - libpulse0
      - libpipewire-0.3-0

AppImage:
  arch: x86_64
  update-information: guess
