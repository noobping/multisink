version: 1

script:
  - mkdir -p Multisink.AppDir/usr/bin Multisink.AppDir/usr/share/icons/hicolor/1024x1024/apps
  - cp data/multisink.png Multisink.AppDir/usr/share/icons/hicolor/1024x1024/apps/multisink.png
  - cp target/release/multisink Multisink.AppDir/usr/bin/

AppDir:
  path: ./Multisink.AppDir

  app_info:
    id: dev.noobping.multisink
    name: Multisink
    icon: multisink
    version: "0.1.3"
    exec: usr/bin/multisink
    exec_args: gui

  files:
    include:
      - /usr/share/icons/Adwaita
      - /usr/share/themes/Adwaita

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://deb.debian.org/debian trixie main"
        key_url: "https://ftp-master.debian.org/keys/archive-key-12.asc"
    include:
      - pkg-config
      - libglib2.0-dev
      - libcairo2-dev
      - libpango1.0-dev
      - libgtk-4-dev
      - libadwaita-1-dev
      - libxkbcommon-dev
      - pulseaudio-utils
    exclude:
      - build-essential
      - libssl3
      - libcrypto3
      - libcurl4
      - cmake
      - gcc
      - clang
      - g++

AppImage:
  arch: x86_64
  update-information: guess