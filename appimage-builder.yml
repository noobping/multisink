version: 1

script:
  - mkdir -p Multisink.AppDir/usr/bin Multisink.AppDir/usr/share/icons/hicolor/1024x1024/apps
  - cp data/multisink.png Multisink.AppDir/usr/share/icons/hicolor/1024x1024/apps/multisink.png
  - cp target/release/multisink Multisink.AppDir/usr/bin/

AppDir:
  path: ./Multisink.AppDir

  app_info:
    id: dev.noobping.multisink
    name: Multisink
    icon: multisink
    version: "0.1.1"
    exec: usr/bin/multisink
    exec_args: gui

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://deb.debian.org/debian bookworm main"
        key_url: "https://ftp-master.debian.org/keys/archive-key-12.asc"
    include:
      - libgtk-4-1
      - libglib2.0-0
      - libpango-1.0-0
      - libharfbuzz0b
      - libfreetype6
      - libpulse0
      - libpipewire-0.3-0
      - libstdc++6
    exclude:
      - cmake
      - gcc
      - g++

AppImage:
  arch: x86_64
  update-information: guess
