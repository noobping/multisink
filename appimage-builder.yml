version: 1

AppDir:
  path: ./Multisink.AppDir

  app_info:
    id: dev.noobping.multisink
    name: Multisink
    icon: multisink
    version: "0.1.0"
    exec: usr/bin/multisink
    exec_args: gui

  apt:
    arch: amd64
    sources:
      - sourceline: "deb http://deb.debian.org/debian bookworm main"
        key_url: "https://ftp-master.debian.org/keys/archive-key-12.asc"
    include:
      - libgtk-4-1
      - libglib2.0-0
      - libgobject-2.0-0
      - libpulse0
      - libpipewire-0.3-0
      - libstdc++6
    exclude:
      - cmake
      - gcc
      - g++

AppImage:
  arch: x86_64
  update-information: guess
